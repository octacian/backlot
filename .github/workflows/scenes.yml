name: Application scenes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: scenes-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    name: Chromium scene (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure job-owned paths
        run: |
          echo "BACKLOT_CI_POINTER=$RUNNER_TEMP/scene-root" >> "$GITHUB_ENV"
          echo "BACKLOT_CI_EXPORT=$RUNNER_TEMP/scene-evidence" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright-browsers" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: examples/ci-scenes/package-lock.json
      - name: Install native and browser OS prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools python3
      - name: Application evidence verifier negative controls
        run: node --test examples/ci-scenes/reports.test.mjs
      - name: Set up private Backlot job
        id: backlot
        uses: ./actions/setup
        with:
          backlot-ref: ${{ github.sha }}
      - name: Action ownership, private export and setup-failure checks
        if: matrix.shard == 1
        run: node --test actions/setup/check.mjs
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/playwright-browsers
          key: scenes-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('examples/ci-scenes/package-lock.json') }}
      - name: Register example paths and install application dependencies
        run: |
          node -e 'require("fs").writeFileSync(process.env.BACKLOT_CI_POINTER, JSON.parse(process.env.BACKLOT_SETUP_OWNER).root, {flag:"wx", mode:0o600})'
          cd examples/ci-scenes
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: One invocation through reusable run with setup retained
        uses: ./actions/run
        id: first-run
        with:
          project: examples/ci-scenes
          scene: browser
          args: '["--shard=${{ matrix.shard }}/2"]'
      - name: Sequential invocation reuses setup and retains earlier evidence
        uses: ./actions/run
        id: second-run
        with:
          project: examples/ci-scenes
          scene: browser
          args: '["--shard=${{ matrix.shard }}/2"]'
          upload-artifacts: false
      - name: Verify invocation isolation and shared runtime survival
        env:
          FIRST: ${{ steps.first-run.outputs.instance-id }}
          SECOND: ${{ steps.second-run.outputs.instance-id }}
          FIRST_EVIDENCE: ${{ steps.first-run.outputs.evidence-path }}
          SECOND_EVIDENCE: ${{ steps.second-run.outputs.evidence-path }}
        run: |
          test "$FIRST" != "$SECOND"
          test "$FIRST_EVIDENCE" != "$SECOND_EVIDENCE"
          test -f "$FIRST_EVIDENCE/report.json"
          test -f "$SECOND_EVIDENCE/report.json"
          backlot gateway status --state-dir "$BACKLOT_STATE_DIR" --json
          backlot inspect "$FIRST" --state-dir "$BACKLOT_STATE_DIR" --json
      - name: Early real HTTPS, missing trust, interaction, failure and recovery
        run: node examples/ci-scenes/ci.mjs run --shard=${{ matrix.shard }}/2
      - name: Export early success, failure and recovery preview
        env:
          BACKLOT_CI_EXPORT: ${{ runner.temp }}/early-preview
        run: node examples/ci-scenes/ci.mjs collect
      - name: Preserve early HTML bundle for independent browser feedback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: early-export-preview-${{ matrix.shard }}
          path: ${{ runner.temp }}/early-preview
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Outer runner cancellation during overlapping clients
        if: matrix.shard == 1
        run: node examples/ci-scenes/signal-check.mjs
      - name: Application lifecycle and worktree isolation
        if: matrix.shard == 1
        run: node examples/ci-scenes/ci.mjs acceptance
      - name: Collect reports, traces and application logs
        if: always()
        run: node examples/ci-scenes/ci.mjs collect
      - name: Upload evidence before runner teardown
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chromium-scene-${{ matrix.shard }}
          path: ${{ runner.temp }}/scene-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Destroy only job-owned resources
        if: always()
        run: node examples/ci-scenes/ci.mjs cleanup
