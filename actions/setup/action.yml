name: Set up Backlot
description: Build pinned Backlot and stock Caddy and start a private Ubuntu job gateway
inputs:
  backlot-ref:
    description: Full 40-character commit SHA from octacian/backlot (source installation only)
    required: true
  node-binary:
    description: Application Node executable (absolute override; defaults to node on PATH)
    required: false
  project:
    description: Application project directory for explicit project setup
    default: .
  project-inputs:
    description: Strict JSON object of nonempty string input values; private CLI stdin transport
    required: false
  project-generate-inputs:
    description: Explicit JSON array of eligible secret input names to generate
    required: false
outputs:
  binary:
    description: Installed Backlot executable
  config:
    description: Private machine configuration
  state-dir:
    description: Private authenticated daemon state (never upload)
  helper:
    description: Evidence collection and explicit cleanup helper
  setup-seconds:
    description: Elapsed setup time including source fetch and builds
runs:
  using: node24
  main: setup.mjs
  post: post.mjs
  post-if: always()
