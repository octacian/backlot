# Keep the application checkout free of Backlot sources; GitHub downloads the
# action package separately at this workflow's commit through the $/ reference.
name: Setup action consumer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Create independent application
        run: |
          mkdir application
          cat > application/backlot.yaml <<'MANIFEST'
          version: backlot/v1
          project: action-consumer
          tools: {node: node}
          outputs:
            reports: {path: reports, concurrency_group: reports}
          components:
            smoke:
              kind: job
              runtime: native
              policy: each-start
              command: {tool: node, args: [smoke.mjs]}
              outputs: [reports]
              artifacts:
                smoke: {path: reports/smoke.txt}
          scenes:
            smoke:
              lifetime: disposable
              components: [smoke]
              terminal_job: smoke
          MANIFEST
          cat > application/smoke.mjs <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          mkdirSync('reports', { recursive: true });
          writeFileSync('reports/smoke.txt', 'independent consumer\n');
          NODE
          git -C application init -b main
          git -C application add .
          git -C application -c user.name=Fixture -c user.email=fixture@example.invalid commit -qm 'Independent application fixture'
          test ! -e go.mod
          test ! -e actions
          test ! -e application/go.mod
          test ! -e application/actions
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.8.1
      - name: Run downloaded action at the workflow commit
        uses: $/actions/quickrun
        id: backlot
        with:
          backlot-ref: ${{ github.sha }}
          project: application
          scene: smoke
          upload-artifacts: false
      - name: Verify packaged action produced application evidence
        env:
          AVAILABLE: ${{ steps.backlot.outputs.evidence-available }}
          EXIT: ${{ steps.backlot.outputs.terminal-exit-code }}
          EVIDENCE: ${{ steps.backlot.outputs.evidence-path }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          assert.equal(process.env.AVAILABLE, 'true');
          assert.equal(process.env.EXIT, '0');
          const root = process.env.EVIDENCE;
          const report = JSON.parse(readFileSync(join(root, 'report.json')));
          assert.equal(report.complete, true);
          const artifact = report.evidence.find(file => file.kind === 'artifact' && file.name === 'smoke');
          assert.ok(artifact, 'application artifact missing from action export');
          assert.equal(readFileSync(join(root, artifact.path), 'utf8'), 'independent consumer\n');
          NODE
