version: 2
project_name: backlot
before:
  hooks:
    - make notices-check
builds:
  - main: ./cmd/backlot
    binary: backlot
    env: [CGO_ENABLED=0]
    targets: [darwin_arm64, linux_amd64_v1]
    flags: [-trimpath, -buildvcs=false]
    ldflags:
      - >-
        -buildid=
        -X main.version={{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
        -X main.commit={{ .FullCommit }}
        -X main.buildTime={{ .CommitDate }}
    mod_timestamp: '{{ .CommitTimestamp }}'
archives:
  - formats: [tar.gz]
    name_template: 'backlot_{{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}_{{ .Os }}_{{ .Arch }}'
    builds_info:
      owner: root
      group: root
      mtime: '{{ .CommitDate }}'
    files:
      - src: LICENSE
        info: {owner: root, group: root, mode: 0644, mtime: '{{ .CommitDate }}'}
      - src: THIRD_PARTY_NOTICES.md
        info: {owner: root, group: root, mode: 0644, mtime: '{{ .CommitDate }}'}
checksum:
  name_template: 'backlot_{{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Tag }}{{ end }}_checksums.txt'
  algorithm: sha256
snapshot:
  version_template: 'dev-{{ .FullCommit }}'
changelog:
  disable: true
release:
  disable: true
