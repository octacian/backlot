# yaml-language-server: $schema=../../schemas/manifest-v1.schema.json
version: backlot/v1
project: ci-scenes
tools: {node: node}
resources:
  port: {kind: port}
  data: {kind: directory}
  origin: {kind: origin}
outputs:
  build: {path: build, concurrency_group: application}
  reports: {path: reports, concurrency_group: application}
environments:
  https:
    assign:
      APP_ORIGIN: {ref: {kind: resource, name: origin, field: url}}
      NODE_EXTRA_CA_CERTS: {ref: {kind: resource, name: origin, field: ca_cert_path}}
components:
  build:
    kind: job
    runtime: native
    policy: each-start
    command: {tool: node, args: [build.mjs]}
    outputs: [build]
  app:
    kind: service
    runtime: native
    command: {tool: node, args: [build/app.mjs]}
    depends_on: [{component: build, condition: completed}]
    resources: [port, data, origin]
    outputs: [build]
    ports: {http: {resource: port}}
    environment_sets: [https]
    environment:
      assign:
        PORT: {ref: {kind: resource, name: port, field: port}}
        APP_DATA: {ref: {kind: resource, name: data, field: path}}
    readiness:
      kind: tcp
      target: {ref: {kind: service, name: app, field: port, port: http}}
      timeout: 10s
  tests:
    kind: job
    runtime: native
    policy: each-start
    command: {tool: node, args: [scene.mjs]}
    depends_on: [{component: app, condition: ready}]
    resources: [origin, data]
    outputs: [reports]
    environment_sets: [https]
    environment:
      pass_through: [PLAYWRIGHT_BROWSERS_PATH]
      assign:
        APP_DATA: {ref: {kind: resource, name: data, field: path}}
    fixtures:
      data: {value: {ref: {kind: resource, name: data, field: path}}}
    artifacts:
      reports: {path: reports}
scenes:
  browser:
    lifetime: disposable
    components: [build, app, tests]
    resources: [port, data, origin]
    terminal_job: tests
    publish:
      resource: origin
      routes: [{path: /, service: app, port: http, prefix: preserve}]
      probe: {kind: http, target: {ref: {kind: resource, name: origin, field: url}}, timeout: 15s}
