name: Application scenes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: scenes-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    name: Chromium scene (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      BACKLOT_BINARY: ${{ github.workspace }}/bin/backlot-linux-amd64
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure job-owned paths
        run: |
          echo "BACKLOT_CADDY_BINARY=$RUNNER_TEMP/scene-tools/caddy" >> "$GITHUB_ENV"
          echo "BACKLOT_CI_POINTER=$RUNNER_TEMP/scene-root" >> "$GITHUB_ENV"
          echo "BACKLOT_CI_EXPORT=$RUNNER_TEMP/scene-evidence" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright-browsers" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: examples/ci-scenes/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/scene-tools
            ${{ runner.temp }}/playwright-browsers
          key: scenes-ubuntu24-amd64-caddy2.11.6-go1.27.1-${{ hashFiles('examples/ci-scenes/package-lock.json') }}
      - name: Bootstrap Ubuntu application prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y lsof libnss3-tools
          mkdir -p "$RUNNER_TEMP/scene-tools"
          if [ ! -x "$BACKLOT_CADDY_BINARY" ]; then
            GOBIN="$RUNNER_TEMP/scene-tools" go install github.com/caddyserver/caddy/v2/cmd/caddy@v2.11.6
          fi
          make release-build RELEASE_GOOS=linux RELEASE_GOARCH=amd64
          cd examples/ci-scenes
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
          node ci.mjs bootstrap
      - name: Early real HTTPS, missing trust, interaction, failure and recovery
        run: node examples/ci-scenes/ci.mjs run --shard=${{ matrix.shard }}/2
      - name: Application lifecycle and worktree isolation
        if: matrix.shard == 1
        run: node examples/ci-scenes/ci.mjs acceptance
      - name: Collect reports, traces and application logs
        if: always()
        run: node examples/ci-scenes/ci.mjs collect
      - name: Upload evidence before runner teardown
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chromium-scene-${{ matrix.shard }}
          path: ${{ runner.temp }}/scene-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Destroy only job-owned resources
        if: always()
        run: node examples/ci-scenes/ci.mjs cleanup
