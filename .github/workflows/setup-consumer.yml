# Independent application fixture: downloads only the existing application files,
# creates its own Git root, and resolves the action through a cross-repository SHA.
name: Setup action consumer
on:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Application test outcome to exercise
        type: choice
        options: [success, failure, cancel]
        default: success
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      MODE: ${{ inputs.mode || 'success' }}
    steps:
      - run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright-browsers" >> "$GITHUB_ENV"
      - name: Prepare independent application checkout from existing fixture
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/fixture-source" "$GITHUB_WORKSPACE/application"
          gh api "repos/octacian/backlot/tarball/$FIXTURE_REF" | tar xz --strip-components=1 -C "$RUNNER_TEMP/fixture-source"
          src="$RUNNER_TEMP/fixture-source/examples/ci-scenes"
          cp "$src/"{app.mjs,build.mjs,backlot.yaml,scene.mjs,playwright.config.mjs,package.json,package-lock.json} "$GITHUB_WORKSPACE/application/"
          cp -R "$src/tests" "$GITHUB_WORKSPACE/application/tests"
          if [ "$MODE" != success ]; then
            cp "$src/failure.config.mjs" "$GITHUB_WORKSPACE/application/"
            cp -R "$src/faults" "$GITHUB_WORKSPACE/application/faults"
          fi
          cd "$GITHUB_WORKSPACE/application"
          git init -b main
          git -c user.name=Fixture -c user.email=fixture@example.invalid add .
          git -c user.name=Fixture -c user.email=fixture@example.invalid commit -qm 'Independent application fixture'
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE/application"
          test ! -e go.mod
          test ! -e actions/setup
          echo "Independent application root: $(git rev-parse --show-toplevel)"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: go-cache
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: setup-consumer-ubuntu24-amd64-go1.27.1-3d7c57cdb20a1bd7d14496d63f687920bbef0c87-caddy2.11.6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: application/package-lock.json
      - name: Install application dependencies
        working-directory: application
        run: |
          sudo apt-get update
          sudo apt-get install -y lsof libnss3-tools
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - id: node
        run: echo "binary=$(command -v node)" >> "$GITHUB_OUTPUT"
      - uses: octacian/backlot/actions/setup@3d7c57cdb20a1bd7d14496d63f687920bbef0c87
        id: backlot
        with:
          backlot-ref: 3d7c57cdb20a1bd7d14496d63f687920bbef0c87
          node-binary: ${{ steps.node.outputs.binary }}
      - name: Run application tests with original exit result
        working-directory: application
        run: |
          args=(--shard=${{ matrix.shard }}/2)
          if [ "$MODE" = failure ]; then args=(--config=failure.config.mjs failure.spec.mjs); fi
          if [ "$MODE" = cancel ]; then args=(--config=failure.config.mjs hold.spec.mjs); fi
          backlot run browser --project "$PWD" --config "$BACKLOT_CONFIG" --state-dir "$BACKLOT_STATE_DIR" --json -- "${args[@]}"
      - name: Collect independent application evidence
        if: always() && env.BACKLOT_SETUP_OWNER != ''
        run: node "$BACKLOT_SETUP_HELPER" collect "$RUNNER_TEMP/consumer-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && env.BACKLOT_SETUP_OWNER != ''
        with:
          name: consumer-${{ matrix.shard }}-${{ inputs.mode || 'success' }}
          path: ${{ runner.temp }}/consumer-evidence
          if-no-files-found: error
      - name: Final cleanup and absence check
        if: always() && env.BACKLOT_SETUP_OWNER != ''
        run: |
          node "$BACKLOT_SETUP_HELPER" cleanup
          node -e 'const fs=require("fs"), {root}=JSON.parse(process.env.BACKLOT_SETUP_OWNER); if(fs.existsSync(root)) throw Error("owned private root remains"); console.log("owned root absent after cleanup")'
      - name: Record setup timing and cache context
        if: always()
        run: echo 'setup_seconds=${{ steps.backlot.outputs.setup-seconds }} go_cache_hit=${{ steps.go-cache.outputs.cache-hit }} mode=${{ env.MODE }} shard=${{ matrix.shard }}'
